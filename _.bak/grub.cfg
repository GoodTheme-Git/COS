# COS live USB boot menu. Works the same from BIOS, 64-bit EFI and 32-bit EFI.
set timeout=6
set default=0
insmod cpuid

# The 64-bit kernel when the CPU has long mode, otherwise the 32-bit one.
# (A 2006 Core Duo or Pentium M is 32-bit only; a Core 2 Duo is 64-bit.)
if cpuid -l; then set k=amd64; set bits=64; else set k=686; set bits=32; fi
set live="boot=live components quiet loglevel=3"

menuentry "COS (${bits}-bit)" {
    linux /live/vmlinuz-$k $live
    initrd /live/initrd-$k
}
menuentry "COS -- safe graphics (try this if the screen goes black)" {
    linux /live/vmlinuz-$k $live nomodeset cos.textmode
    initrd /live/initrd-$k
}
menuentry "Install COS to the hard disk (ERASES the disk you choose)" {
    linux /live/vmlinuz-$k $live cos.install
    initrd /live/initrd-$k
}
menuentry "COS with the 32-bit kernel" {
    linux /live/vmlinuz-686 $live
    initrd /live/initrd-686
}
if [ "$grub_platform" = "pc" ]; then
    menuentry "Boot from the hard disk instead" {
        set root=(hd1)
        chainloader +1
    }
fi
menuentry "Restart" { reboot }
